[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "assistente-progep-ifs"
version = "0.1.0"
description = "Assistente Inteligente PROGEP-IFS (Contact Center PROGEP) - Agentic RAG solution"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "PROGEP-IFS" }]

dependencies = [
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "boto3>=1.34",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q"
markers = [
    "property: property-based tests (Hypothesis)",
    "unit: example-based unit tests",
    "integration: integration tests against AWS services",
]

[tool.hypothesis]
# Minimum of 100 iterations per property (design.md Testing Strategy).
max_examples = 100
